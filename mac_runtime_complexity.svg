<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">배열 크기와 MAC 평균 실행시간</title>
  <desc id="description">x축은 배열 한 변의 길이 N에 비례하며, 3, 5, 13, 25일 때 측정한 실행시간은 각각 0.003310, 0.006960, 0.035900, 0.124990 밀리초입니다.</desc>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="425" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#111827">배열 크기별 MAC 평균 실행시간</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="90" y1="400" x2="755" y2="400"/>
    <line x1="90" y1="351.43" x2="755" y2="351.43"/>
    <line x1="90" y1="302.86" x2="755" y2="302.86"/>
    <line x1="90" y1="254.29" x2="755" y2="254.29"/>
    <line x1="90" y1="205.71" x2="755" y2="205.71"/>
    <line x1="90" y1="157.14" x2="755" y2="157.14"/>
    <line x1="90" y1="108.57" x2="755" y2="108.57"/>
    <line x1="90" y1="60" x2="755" y2="60"/>
    <line x1="90" y1="60" x2="90" y2="400"/>
    <line x1="213.15" y1="60" x2="213.15" y2="400"/>
    <line x1="336.30" y1="60" x2="336.30" y2="400"/>
    <line x1="459.44" y1="60" x2="459.44" y2="400"/>
    <line x1="582.59" y1="60" x2="582.59" y2="400"/>
    <line x1="705.74" y1="60" x2="705.74" y2="400"/>
  </g>

  <g stroke="#111827" stroke-width="2">
    <line x1="90" y1="60" x2="90" y2="400"/>
    <line x1="90" y1="400" x2="755" y2="400"/>
  </g>

  <g font-family="sans-serif" font-size="13" fill="#111827" text-anchor="end">
    <text x="78" y="404">0.00</text>
    <text x="78" y="355.43">0.02</text>
    <text x="78" y="306.86">0.04</text>
    <text x="78" y="258.29">0.06</text>
    <text x="78" y="209.71">0.08</text>
    <text x="78" y="161.14">0.10</text>
    <text x="78" y="112.57">0.12</text>
    <text x="78" y="64">0.14</text>
  </g>

  <g font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">
    <text x="90" y="423">0</text>
    <text x="213.15" y="423">5</text>
    <text x="336.30" y="423">10</text>
    <text x="459.44" y="423">15</text>
    <text x="582.59" y="423">20</text>
    <text x="705.74" y="423">25</text>
    <text x="422.5" y="457" font-size="15">배열 한 변의 길이 N</text>
  </g>
  <text x="24" y="230" transform="rotate(-90 24 230)" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#111827">평균 실행시간 (ms)</text>

  <polyline points="163.89,391.98 213.15,383.10 410.19,312.81 705.74,96.45" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="163.89" cy="391.98" r="6"/>
    <circle cx="213.15" cy="383.10" r="6"/>
    <circle cx="410.19" cy="312.81" r="6"/>
    <circle cx="705.74" cy="96.45" r="6"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">
    <text x="165" y="375">0.003310</text>
    <text x="220" y="364">0.006960</text>
    <text x="410" y="295">0.035900</text>
    <text x="684" y="79">0.124990</text>
  </g>
</svg>
